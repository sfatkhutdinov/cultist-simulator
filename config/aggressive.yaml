# Example Configuration: Aggressive Learning
# Use this for extended training runs to maximize learning

agent:
  id: "aggressive_learner_001"
  window_name: "Cultist Simulator"
  max_actions_per_episode: 200  # Longer episodes
  
vision:
  # Faster vision pipeline (lower quality for speed)
  capture_timeout_ms: 500
  detection_confidence: 0.5  # Lower threshold = more detections
  ocr_confidence: 0.4
  enable_caching: true
  
automation:
  # Faster action execution
  action_delay_ms: 500  # 0.5 seconds between actions
  click_duration_ms: 50
  enable_focus_check: true
  
safety:
  # Safety constraints (NEVER DISABLE THESE)
  bounds_validation: true
  rate_limiting: true
  max_actions_per_second: 2  # More aggressive
  window_focus_required: true
  
  # Blacklisted keys (CRITICAL)
  blacklisted_keys:
    - "cmd+q"
    - "cmd+w"
    - "cmd+tab"
    - "alt+f4"
    - "cmd+option+esc"
    
  # Larger allowed area
  safe_area:
    margin_top_percent: 2
    margin_bottom_percent: 2
    margin_left_percent: 2
    margin_right_percent: 2
  
learning:
  # Aggressive RL settings for faster learning
  algorithm: "PPO"
  exploration_rate: 0.5  # High exploration
  learning_rate: 0.001  # Fast learning
  gamma: 0.95
  batch_size: 64
  entropy_coefficient: 0.1  # Encourage exploration
  
  # Experience replay
  buffer_size: 10000
  prioritized_replay: true
  
  # Knowledge base
  store_all_sessions: true
  similarity_threshold: 0.7  # More lenient matching
  max_history_size: 5000
  
nlp:
  # Text analysis
  model: "all-MiniLM-L6-v2"
  max_text_length: 512
  embedding_cache_size: 5000
  goal_extraction_enabled: true
  semantic_similarity_threshold: 0.6
  
orchestrator:
  # Extended episodes
  max_episode_duration_sec: 900  # 15 minutes
  checkpoint_frequency: 25
  enable_tensorboard: true
  enable_session_replay: true
  
  # Performance optimization
  parallel_episodes: 1  # Run one at a time for stability
  
  # Crash recovery
  auto_save: true
  resume_on_restart: true
  
logging:
  level: "DEBUG"  # More detailed logging
  format: "json"
  output_dir: "data/logs"
  rotate_logs: true
  max_log_size_mb: 500
